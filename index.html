<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafa"><title>Pepero Kiss</title><link rel="stylesheet" href="./style.css?v=6"></head>
<body><main><header><a href="./" class="brand">Pepero Kiss</a><span id="connection">대기</span></header>
<section id="lobby"><h1>Pepero Kiss</h1><p>2인용 탭 게임</p><div class="mode-buttons"><button id="create-together">만나서하기</button><button id="create-remote">원격으로 하기</button></div><button id="demo">혼자 테스트</button></section>
<section id="game" hidden><div class="toolbar"><button id="share">링크 복사</button><button id="new">다시하기</button></div><p id="status" role="status" aria-live="polite">상대 대기 중</p><div id="stage"><canvas id="canvas" width="390" height="844" tabindex="0" role="button" aria-label="탭하여 이동"></canvas></div><div class="toolbar"><span id="score"></span><label>크기 <input id="scale" type="range" min="65" max="100" value="100" aria-label="화면 크기 보정"></label></div><details><summary>전체 화면</summary><canvas id="overview" width="780" height="844" aria-label="전체 게임 화면"></canvas></details><input id="invite" readonly aria-label="방 링크"></section>
<p id="error" role="alert" hidden></p></main><script type="module" src="./app.js?v=6"></script></body></html>
