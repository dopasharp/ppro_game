<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0E0D"><title>빼빼로 게임 | DOPA#</title><meta name="description" content="함께 탭하며 가까워지는 귀여운 2인용 빼빼로게임"><meta name="dopasharp:game" content="ppro_game"><link rel="canonical" href="https://dopasharp.github.io/ppro_game/"><meta property="og:type" content="website"><meta property="og:title" content="빼빼로 게임 🥢"><meta property="og:site_name" content="DOPASHARP"><meta property="og:description" content="둘이 함께 탭해서 빼빼로 양 끝의 곰을 만나게 해요. 휴대폰 두 대로 하는 2인용 탭 게임."><meta property="og:url" content="https://dopasharp.github.io/ppro_game/"><meta property="og:image" content="https://dopasharp.github.io/ppro_game/og/pepero.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="./dopasharp/tokens.css"><link rel="stylesheet" href="./dopasharp/components.css"><link rel="stylesheet" href="./style.css?v=50"><script src="./dopasharp/dopasharp.js" defer></script></head>
<body><main><header><div data-dopa="header"></div><span id="connection"></span></header>
<section id="lobby"><p class="dopa-label">TWO-PHONE TAP GAME</p><h1>빼빼로 게임 🥢</h1><p class="lead">둘이 함께 탭해서 빼빼로 양 끝의 곰을 만나게 해요.</p><ol class="steps"><li>두 사람 이름과 하고 싶은 말을 적어요.</li><li>방을 만들고 링크를 친구에게 보내요.</li><li>각자 화면을 탭! 합쳐서 24번이면 두 곰이 만나요.</li></ol><div class="initials"><label for="my-initial">내 이름 · 별명<input id="my-initial" maxlength="12" required placeholder="이름 또는 별명" autocomplete="off" aria-describedby="initials-help"></label><label for="partner-initial">상대 이름 · 별명<input id="partner-initial" maxlength="12" required placeholder="이름 또는 별명" autocomplete="off" aria-describedby="initials-help"></label></div><p id="initials-help" class="initials-help">두 사람의 이름이나 별명을 모두 입력해주세요. (최대 12자)</p><label class="meeting-label" for="meeting-message">하고 싶은 말을 입력하세요</label><input id="meeting-message" maxlength="40" placeholder="하고 싶은 말을 입력하세요" value="다 먹었다! ♥" aria-describedby="meeting-help"><p id="meeting-help" class="initials-help">원하는 문구로 바꿔주세요. 비워두면 표시하지 않아요. (최대 40자)</p><div class="mode-buttons"><button id="create-together" class="dopa-button">만나서하기<small>두 폰을 나란히</small></button><button id="create-remote" class="dopa-button dopa-button--secondary">원격으로 하기<small>떨어져서 각자</small></button></div><footer data-dopa="footer"></footer></section>
<section id="game" hidden><div class="toolbar"><button id="new">다시하기</button><button id="create-new">새 방 만들기</button></div><button id="share-menu" aria-expanded="false" aria-controls="seat-links">링크 공유</button><div id="seat-links" class="seat-links" hidden><div id="left-seat" class="seat-card"><span class="seat-position">왼쪽 방 <span id="left-current"></span></span><strong id="left-name"></strong><button id="share-left">L: 이름 링크 복사</button></div><div id="right-seat" class="seat-card"><span class="seat-position">오른쪽 방 <span id="right-current"></span></span><strong id="right-name"></strong><button id="share">R: 이름 링크 복사</button></div></div><p id="status" role="status" aria-live="polite">방 정보 불러오는 중</p><div id="countdown" role="status" aria-live="polite" hidden><strong id="countdown-number">3!</strong></div><div id="stage"><canvas id="canvas" width="390" height="844" tabindex="0" role="button" aria-label="게임 화면 터치"></canvas></div><div class="toolbar"><span id="score"></span><label>크기 <input id="scale" type="range" min="65" max="100" value="100" aria-label="화면 크기 보정"></label></div><details><summary>전체 화면</summary><canvas id="overview" width="780" height="844" aria-label="전체 게임 화면"></canvas></details></section>
<p id="notice" role="status" aria-live="polite" hidden></p><p id="error" role="alert" hidden></p></main><div id="connecting-overlay" role="status" aria-live="polite" hidden><span class="connection-spinner" aria-hidden="true"></span><strong id="connecting-title">잠시만 기다려주세요!</strong><p>연결 중…</p></div><script>if(location.hash){document.body.classList.add('connecting');document.querySelector('main').inert=true;document.getElementById('connecting-overlay').hidden=false;}</script><script type="module" src="./app.js?v=50"></script></body></html>
