<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9edf7"><title>빼빼로게임</title><meta name="description" content="함께 탭하며 가까워지는 귀여운 2인용 빼빼로게임"><meta property="og:type" content="website"><meta property="og:title" content="빼빼로게임"><meta property="og:site_name" content="빼빼로게임"><meta property="og:description" content="함께 탭하며 가까워지는 귀여운 2인용 빼빼로게임"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="빼빼로게임"><meta name="twitter:description" content="함께 탭하며 가까워지는 귀여운 2인용 빼빼로게임"><link rel="stylesheet" href="./style.css?v=49"></head>
<body><main><header><a href="./" class="brand">빼빼로게임</a><span id="connection"></span></header>
<section id="lobby"><h1>빼빼로게임</h1><p>2인용 탭 게임</p><div class="initials"><label for="my-initial">내 이름 · 별명<input id="my-initial" maxlength="12" required placeholder="이름이나 별명을 입력하세요" autocomplete="off" aria-describedby="initials-help"></label><label for="partner-initial">상대 이름 · 별명<input id="partner-initial" maxlength="12" required placeholder="이름이나 별명을 입력하세요" autocomplete="off" aria-describedby="initials-help"></label></div><p id="initials-help" class="initials-help">두 사람의 이름이나 별명을 모두 입력해주세요. (최대 12자)</p><label class="meeting-label" for="meeting-message">하고 싶은 말을 입력하세요</label><input id="meeting-message" maxlength="40" placeholder="하고 싶은 말을 입력하세요" value="다 먹었다! ♥" aria-describedby="meeting-help"><p id="meeting-help" class="initials-help">원하는 문구로 바꿔주세요. 비워두면 표시하지 않아요. (최대 40자)</p><div class="mode-buttons"><button id="create-together">만나서하기</button><button id="create-remote">원격으로 하기</button></div></section>
<section id="game" hidden><div class="toolbar"><button id="new">다시하기</button><button id="create-new">새 방 만들기</button></div><button id="share-menu" aria-expanded="false" aria-controls="seat-links">링크 공유</button><div id="seat-links" class="seat-links" hidden><div id="left-seat" class="seat-card"><span class="seat-position">왼쪽 방 <span id="left-current"></span></span><strong id="left-name"></strong><button id="share-left">L: 이름 링크 복사</button></div><div id="right-seat" class="seat-card"><span class="seat-position">오른쪽 방 <span id="right-current"></span></span><strong id="right-name"></strong><button id="share">R: 이름 링크 복사</button></div></div><p id="status" role="status" aria-live="polite">방 정보 불러오는 중</p><div id="countdown" role="status" aria-live="polite" hidden><strong id="countdown-number">3!</strong></div><div id="stage"><canvas id="canvas" width="390" height="844" tabindex="0" role="button" aria-label="게임 화면 터치"></canvas></div><div class="toolbar"><span id="score"></span><label>크기 <input id="scale" type="range" min="65" max="100" value="100" aria-label="화면 크기 보정"></label></div><details><summary>전체 화면</summary><canvas id="overview" width="780" height="844" aria-label="전체 게임 화면"></canvas></details></section>
<p id="notice" role="status" aria-live="polite" hidden></p><p id="error" role="alert" hidden></p></main><div id="connecting-overlay" role="status" aria-live="polite" hidden><span class="connection-spinner" aria-hidden="true"></span><strong id="connecting-title">잠시만 기다려주세요!</strong><p>연결 중…</p></div><script>if(location.hash){document.body.classList.add('connecting');document.querySelector('main').inert=true;document.getElementById('connecting-overlay').hidden=false;}</script><script type="module" src="./app.js?v=49"></script></body></html>
